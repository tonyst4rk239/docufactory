# ==============================================================================
# Docu Factory — Configuración Central de Edición y Efectos (FFmpeg)
# ==============================================================================
# Todos los efectos pueden activarse/desactivarse globalmente o por formato
# (horizontal_16_9 y vertical_9_16) y ajustar sus intensidades sin tocar código.
# Si falta algún asset en disco, el motor degrada con elegancia al efecto
# equivalente de FFmpeg o al mood más cercano.

formatos:
  horizontal_16_9:
    fps: 30
    resolucion: [1920, 1080]
    color_grading: true
    vignette: true
    film_grain_ffmpeg: true
    video_overlay: true
    ken_burns: true
    transiciones_xfade: true
    top_rank_fx: true
    audio_ducking_sidechain: true

  vertical_9_16:
    fps: 30
    resolucion: [1080, 1920]
    duracion_corte_min_s: 2.0
    duracion_corte_max_s: 3.0
    color_grading: true
    vignette: true
    film_grain_ffmpeg: true
    video_overlay: true
    zoom_punch: true
    subtitulos_karaoke: true
    audio_ducking_sidechain: true

color_grading:
  enabled: true
  moods:
    misterio:
      # Neutro-frío sin tinte morado/magenta (v3: menos azul, verde compensado), menos desaturación y sombras preservadas con curves
      saturation: 0.88
      contrast: 1.05
      brightness: 0.00
      colorbalance: "rs=-0.02:gs=0.02:bs=0.01:rm=-0.02:gm=0.02:bm=0.00"
      curves: "master='0/0.02 0.18/0.19 0.50/0.51 0.85/0.86 1/1'"
    tension:
      # Contraste frío controlado conservando detalle en sombras
      saturation: 0.82
      contrast: 1.10
      brightness: -0.01
      colorbalance: "rs=-0.02:gs=0.02:bs=0.02:rm=-0.02:gm=0.02:bm=0.00"
      curves: "master='0/0.01 0.20/0.20 0.50/0.51 0.85/0.86 1/1'"
    epica:
      # Contraste cálido cinematográfico (dorado / ámbar en altas luces)
      saturation: 1.12
      contrast: 1.16
      brightness: -0.01
      colorbalance: "rs=0.08:gs=0.02:bs=-0.08:rm=0.10:gm=0.03:bm=-0.06:rh=0.06"
    curiosidad:
      # Look documental moderno (teal & orange sutil)
      saturation: 0.94
      contrast: 1.10
      brightness: -0.01
      colorbalance: "rs=-0.03:bs=0.06:rm=0.04:bm=0.04:rh=0.05"
    calma:
      # Suave y equilibrado
      saturation: 0.90
      contrast: 1.04
      brightness: 0.01
      colorbalance: "rm=0.04:gm=0.01:bm=0.03"

textura_visual:
  vignette:
    enabled: true
    angle: "PI/5"
  film_grain_ffmpeg:
    enabled: true
    alls: 8
    allf: "t"
  video_overlay:
    enabled: true
    blend_mode: "screen"
    opacity: 0.14          # v3: más bajo para no teñir (morado) la imagen
    por_mood:
      misterio: ["dust_overlay", "film_grain"]   # sin "vhs": su capa morada teñía la imagen
      tension: ["film_grain", "dust_overlay"]    # sin "vhs"/"glitch" (tinte morado/azul)
      epica: ["light_leak", "dust_overlay", "film_grain"]
      curiosidad: ["dust_overlay", "light_leak", "film_grain"]
      calma: ["dust_overlay", "light_leak"]

ken_burns:
  enabled: true
  zoom_inicial: 1.00
  zoom_final: 1.08
  aplicar_en_estaticos: true
  aplicar_en_clips_cortos: true

transiciones:
  enabled: true
  duracion_s: 0.35
  tipos_normales: ["fade", "fadeblack", "smoothleft"]
  en_cambio_top: "glitch"
  sfx_whoosh: true

top_rank_fx:
  enabled: true
  riser_enabled: true
  riser_lead_s: 1.5        # Riser entra 1.5s antes de cada tarjeta TOP #N
  riser_volume: 0.65
  impact_enabled: true
  impact_volume: 0.85
  flash_glitch_enabled: true
  flash_duracion_s: 0.35
  rgbashift_rh: -6
  rgbashift_bh: 6
  flash_brightness: 0.12
  card_delay_post_glitch_s: 0.35  # La tarjeta TOP #N aparece 0.35s después del glitch/pixelize
  card_duracion_s: 3.5
  card_font_size_top: 184         # ~2x más grande y legible (antes 90pt)
  card_font_size_titulo: 116      # ~2x más grande (antes 62pt)
  card_back_colour: "&H58000000"  # Fondo semitransparente oscuro (~65% opacidad)

audio:
  ducking_sidechain:
    enabled: true
    musica_volumen_base: 0.28
    threshold: 0.035
    ratio: 5.0
    attack_ms: 35
    release_ms: 450
    makeup: 1.0
  lufs_target: -16.0

reels_9_16:
  cortes_rapidos:
    enabled: true
    min_s: 2.0
    max_s: 3.0
  karaoke:
    enabled: true
    font_size: 112
    palabras_por_linea: 3
    color_activo: "&H0000FFFF&"     # Amarillo neón
    color_inactivo: "&H00FFFFFF&"   # Blanco
    color_keyword: "&H00FFFF00&"    # Cian neón
  zoom_punch:
    enabled: true
    factor: 1.08
    duracion_s: 0.35

# ------------------------------------------------------------------------------
# Retención: rotación de tomas dentro de cada escena (16:9)
# ------------------------------------------------------------------------------
tomas:
  enabled: true
  corte_min_s: 3.0
  corte_max_s: 5.0
  max_clips_distintos_por_escena: 6

# ------------------------------------------------------------------------------
# Clips reales (clips_fuente en el guion): panel 'EVIDENCIA' transformado
# ------------------------------------------------------------------------------
clips_reales:
  duracion_min_s: 3.0
  duracion_max_s: 6.0
  escala_panel: 0.70
  etiqueta: "EVIDENCIA"
  zoom_lento: 0.06
  oscurecer_fondo: -0.22
  desenfoque_fondo: 22
  yavg_realce: 55        # fragmentos reales más oscuros que esto se aclaran (gamma) para evitar tomas casi negras
  fin_tarjeta_s: 4.0     # con tarjeta TOP/texto, la 1.ª toma real va a pantalla completa y dura >= 4 s

# ------------------------------------------------------------------------------
# Tarjeta final de créditos: obras CC BY / CC BY-SA con título, autor, licencia y enlace
# (se anexa al final del largo; la descripción de YouTube puede llevar solo el resumen)
# ------------------------------------------------------------------------------
creditos_finales:
  enabled: true
  obras_por_pagina: 9
  segundos_por_pagina: 3.0
